name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:unit

      # Production runs on Cloudflare Workers. A plain local build uses the Node
      # preset; this builds what Workers Builds deploys, so fork PRs (which Workers
      # Builds doesn't build) are checked against the real target too.
      - name: Build for Cloudflare Workers
        run: npm run build
        env:
          NITRO_PRESET: cloudflare_module

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Build app with client sourcemaps
        run: npm run build
        env:
          COVERAGE: '1'

      - name: Run Playwright tests with coverage
        run: npm run test:e2e
        env:
          COVERAGE: '1'

      - name: Merge Vitest and Playwright coverage
        run: node test/coverage/merge.ts

      - name: Run migrated e2e tests
        run: npm run test:e2e:run

      - name: Publish coverage summary
        if: hashFiles('coverage/coverage-summary.md') != ''
        run: |
          {
            cat coverage/coverage-summary.md
            echo ""
            echo "<details>"
            echo "<summary>Per-file breakdown</summary>"
            echo ""
            tail -n +2 coverage/coverage-details.md
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: hashFiles('coverage/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure() && hashFiles('.e2e/report.html') != ''
        with:
          name: e2e-report
          path: |
            .e2e/report.html
            .e2e/results/
          include-hidden-files: true
          retention-days: 14
